name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Same-repository pull requests deploy an isolated Cloudflare Preview, never
  # production; the broker decides from the run's verified identity. Closing
  # the pull request deletes its preview.
  pull_request:
    types: [opened, synchronize, reopened, closed]

# One run per pull request at a time, never cancelled: the broker completes
# work a cancelled job started, so an overlapping deploy could recreate a
# deleted preview, or a cleanup delete a reopened one. A newer pending run
# still replaces an older pending one, so pushes collapse.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-preview-{1}', github.workflow, github.event.pull_request.number) || 'cloudflare-production' }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    # GitHub issues no OIDC token to fork pull requests, so they cannot deploy.
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'closed')
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    uses: tempoxyz/gh-actions/.github/workflows/cloudflare-deploy-broker-build.yml@0319990f50971b44f0e7d6ac03f080323ca22178 # 2026-10-28T23-57-40Z-0319990f
    with:
      artifact-name: pathusd-reserves

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@0319990f50971b44f0e7d6ac03f080323ca22178 # 2026-10-28T23-57-40Z-0319990f

      - name: Deploy through the broker
        id: broker
        uses: tempoxyz/gh-actions/actions/cloudflare-deploy-broker@0319990f50971b44f0e7d6ac03f080323ca22178 # 2026-10-28T23-57-40Z-0319990f
        with:
          deployment-id: pathusd-reserves
          artifact-id: ${{ needs.build.outputs.artifact-id }}
          archive-digest: ${{ needs.build.outputs.archive-digest }}
          module-digest: ${{ needs.build.outputs.module-digest }}

      - name: Summarize deployment
        env:
          KIND: ${{ github.event_name == 'pull_request' && 'preview deployment' || 'version' }}
          VERIFICATION_URL: ${{ steps.broker.outputs.verification-url }}
          VERSION_ID: ${{ steps.broker.outputs.version-id }}
        run: |
          {
            echo "Deployed ${KIND} \`${VERSION_ID}\`"
            echo
            echo "${VERIFICATION_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

  delete-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@6c2beb6fb8f2471ba859eb666b907389acc5fc8b # 2026-10-29T05-55-18Z-6c2beb6f

      - name: Delete the pull request's preview
        uses: tempoxyz/gh-actions/actions/cloudflare-deploy-broker-delete-preview@6c2beb6fb8f2471ba859eb666b907389acc5fc8b # 2026-10-29T05-55-18Z-6c2beb6f
        with:
          deployment-id: pathusd-reserves
          account-id: ba6ee3674b03f08481e57ff9992c601e
          worker-name: pathusd-reserves
